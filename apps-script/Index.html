<!doctype html>
<html lang="ko"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8">
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#203047;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.panel{background:white;padding:18px;border-radius:14px;border:1px solid #e0e5ee;margin-top:16px}header,.bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}h1{font-size:24px}button,select,input,textarea{font:inherit;border:1px solid #cad4df;border-radius:7px;padding:8px;max-width:100%}button{cursor:pointer;background:#fff}.primary{color:white;background:#2463c5;border-color:#2463c5}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week>div{text-align:center;font-weight:bold;padding:9px}.day{min-height:108px;border:1px solid #e0e5ee;padding:6px;cursor:pointer}.blank{background:#f8f9fb}.num{font-weight:700}.sun .num{color:#d14343}.sat .num{color:#4276cc}.tag{background:#e9f1ff;border-radius:5px;padding:4px;margin-top:4px;font-size:12px;overflow-wrap:anywhere}.duty{background:#fff1d9}.hint{font-size:12px;color:#687991}.hide{display:none!important}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}dialog{border:0;border-radius:14px;padding:22px;width:min(96vw,510px);box-shadow:0 20px 70px #0004}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.error{color:#b03030}.entry{border-bottom:1px solid #eee;padding:8px 0} @media(max-width:650px){.wrap{padding:8px}.panel{padding:10px}.day{min-height:75px;padding:3px}.tag{font-size:10px}.form{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><div><h1>명상센터 일정관리</h1><span class="hint">공유 일정 · 일요일 당번 신청</span></div><button id="logout" class="hide">로그아웃</button></header>
<section id="login" class="panel"><h2>로그인</h2><p>관리자 또는 일반 사용자 계정으로 로그인하세요.</p><select id="role"><option value="member">일반 사용자</option><option value="admin">관리자</option></select> <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password"> <button class="primary" id="signIn">로그인</button><p id="loginError" class="error"></p></section>
<section id="app" class="panel hide"><div class="bar"><div><button id="prev">◀</button> <select id="year"></select><select id="month"></select> <button id="next">▶</button> <button id="today">이번 달</button></div><button class="primary hide" id="add">+ 일정 등록</button></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="calendar" id="calendar"></div><p class="hint">날짜를 누르면 해당 날짜의 일정과 일요일 당번 신청을 확인할 수 있습니다.</p></section><p id="status" role="status"></p>
<dialog id="detail"><h3 id="dateTitle"></h3><div id="items"></div><div id="dutyBlock"><h4>일요일 당번 신청</h4><select id="dutyPerson"></select> <button class="primary" id="signDuty">신청</button></div><div id="editBlock" class="hide"><h4 id="formTitle">일정 등록</h4><form id="editForm"><div class="form"><label>날짜<input id="date" type="date" required></label><label>구분<select id="category" required></select></label><label>일정명<select id="event" required></select></label><label>담당자<select id="person"></select></label><label>시작<input id="start" type="time"></label><label>종료<input id="end" type="time"></label><label class="full">상세내용<textarea id="details" rows="3"></textarea></label></div><div class="actions"><button class="primary" type="submit">저장</button></div></form></div><div class="actions"><button id="close">닫기</button></div></dialog></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),iso=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token='',role='',data={schedules:[],categories:[],events:[],people:[]},now=new Date(),year=now.getFullYear(),month=now.getMonth(),selected='',editId='';
function run(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args))}
function message(s,isError=false){$('status').textContent=s;$('status').className=isError?'error':''}
function opts(id,arr,placeholder){$(id).innerHTML=(placeholder?'<option value="">'+escape(placeholder)+'</option>':'')+arr.map(x=>'<option value="'+escape(x.id)+'">'+escape(x.name)+'</option>').join('')}
function active(tab){return data[tab].filter(x=>x.active)}
function mapServer(r){const normalizeDate=v=>String(v||'').slice(0,10);data={
 schedules:(r.schedules||[]).filter(x=>x['상태']!=='취소').map(x=>({id:String(x['ID']),date:normalizeDate(x['날짜']),category:String(x['구분ID']),event:String(x['일정ID']),person:String(x['담당자ID']||''),start:String(x['시작시간']||''),end:String(x['종료시간']||''),details:String(x['상세내용']||'')})),
 categories:(r.categories||[]).map(x=>({id:String(x['구분ID']),name:String(x['구분명']),active:String(x['사용여부'])==='사용'})),
 events:(r.events||[]).map(x=>({id:String(x['일정ID']),cat:String(x['구분ID']),name:String(x['일정명']),active:String(x['사용여부'])==='사용'})),
 people:(r.people||[]).map(x=>({id:String(x['담당자ID']),name:String(x['담당자명']),active:String(x['사용여부'])==='사용'}))};}
const name=(tab,id)=>data[tab].find(x=>x.id===id)?.name||id;
async function load(){message('일정을 불러오는 중...');try{mapServer(await run('uiReadMonth',token,year,month+1));render();message('')}catch(e){message(e.message||String(e),true)}}
function render(){$('year').value=year;$('month').value=month;let html='',first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();for(let i=0;i<first;i++)html+='<div class="day blank"></div>';for(let d=1;d<=count;d++){const dt=iso(year,month,d),wd=new Date(year,month,d).getDay(),entries=data.schedules.filter(x=>x.date===dt),duties=entries.filter(x=>name('categories',x.category)==='주말당번').length;html+='<div class="day '+(wd===0?'sun':wd===6?'sat':'')+'" data-date="'+dt+'"><div class="num">'+d+'</div>'+entries.map(x=>'<div class="tag '+(name('categories',x.category)==='주말당번'?'duty':'')+'">'+escape(name('events',x.event))+(x.person?' · '+escape(name('people',x.person)):'')+'</div>').join('')+(wd===0?'<div class="hint">당번 '+duties+'/2</div>':'')+'</div>'}$('calendar').innerHTML=html}
function syncEvents(){const cat=$('category').value;opts('event',active('events').filter(x=>x.cat===cat))}
function edit(e){editId=e?.id||'';$('date').value=e?.date||selected;opts('category',active('categories'));$('category').value=e?.category||active('categories')[0]?.id||'';syncEvents();$('event').value=e?.event||$('event').value;opts('person',active('people'),'미지정');$('person').value=e?.person||'';$('start').value=e?.start||'';$('end').value=e?.end||'';$('details').value=e?.details||'';$('formTitle').textContent=editId?'일정 수정':'일정 등록'}
function open(dt){selected=dt;$('dateTitle').textContent=dt+' 일정';const entries=data.schedules.filter(x=>x.date===dt);$('items').innerHTML=entries.length?entries.map(e=>'<div class="entry"><strong>'+escape(name('events',e.event))+'</strong> '+escape(name('people',e.person))+' '+escape(e.start)+(e.details?'<p>'+escape(e.details)+'</p>':'')+(role==='admin'?'<button data-edit="'+escape(e.id)+'">수정</button> <button data-cancel="'+escape(e.id)+'">취소</button>':'')+'</div>').join(''):'<p class="hint">등록된 일정이 없습니다.</p>';const sunday=new Date(dt+'T12:00:00').getDay()===0;$('dutyBlock').classList.toggle('hide',!sunday||entries.filter(e=>name('categories',e.category)==='주말당번').length>=2);opts('dutyPerson',active('people'),'담당자를 선택하세요');$('editBlock').classList.toggle('hide',role!=='admin');if(role==='admin')edit(null);$('detail').showModal()}
$('signIn').onclick=async()=>{try{$('signIn').disabled=true;$('loginError').textContent='';const r=await run('uiLogin',$('role').value,$('password').value);token=r.token;role=$('role').value;$('password').value='';$('login').classList.add('hide');$('app').classList.remove('hide');$('logout').classList.remove('hide');$('add').classList.toggle('hide',role!=='admin');await load()}catch(e){$('loginError').textContent=e.message||String(e)}finally{$('signIn').disabled=false}};
$('logout').onclick=async()=>{try{if(token)await run('uiLogout',token)}finally{token='';role='';$('app').classList.add('hide');$('login').classList.remove('hide');$('logout').classList.add('hide');message('')}};
$('calendar').onclick=e=>{const cell=e.target.closest('[data-date]');if(cell)open(cell.dataset.date)};
$('items').onclick=async e=>{const b=e.target.closest('[data-edit],[data-cancel]');if(!b)return;const id=b.dataset.edit||b.dataset.cancel,item=data.schedules.find(x=>x.id===id);if(b.dataset.edit){if(item)edit(item)}else if(confirm('이 일정을 취소할까요?')){try{await run('uiCancel',token,id);$('detail').close();await load()}catch(err){alert(err.message||String(err))}}};
$('category').onchange=syncEvents;$('editForm').onsubmit=async e=>{e.preventDefault();const s={date:$('date').value,categoryId:$('category').value,eventId:$('event').value,personId:$('person').value,start:$('start').value,end:$('end').value,details:$('details').value};try{await run('uiSave',token,s,editId);$('detail').close();await load()}catch(err){alert(err.message||String(err))}};
$('signDuty').onclick=async()=>{const person=$('dutyPerson').value;if(!person)return alert('담당자를 선택하세요.');try{await run('uiSignUpDuty',token,selected,person);$('detail').close();await load()}catch(e){alert(e.message||String(e))}};
$('close').onclick=()=>$('detail').close();$('add').onclick=()=>open(iso(year,month,1));for(let y=2020;y<=2045;y++)$('year').add(new Option(y+'년',y));for(let m=0;m<12;m++)$('month').add(new Option(m+1+'월',m));function move(n){let d=new Date(year,month+n,1);year=d.getFullYear();month=d.getMonth();load()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('today').onclick=()=>{year=new Date().getFullYear();month=new Date().getMonth();load()};$('year').onchange=e=>{year=+e.target.value;load()};$('month').onchange=e=>{month=+e.target.value;load()};
})();
</script></body></html>
