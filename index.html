<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>명상센터 일정관리</title>
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#203047;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0}p{color:#627187}.panel{background:white;border:1px solid #dde4ed;border-radius:15px;padding:18px;margin:18px 0;box-shadow:0 2px 9px #192b4010}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}.controls{display:flex;gap:7px;align-items:center}button,select,input,textarea{font:inherit;border:1px solid #cad4df;border-radius:8px;padding:9px;background:white}button{cursor:pointer}button.primary{background:#2463c5;color:white;border-color:#2463c5}button.danger{color:#aa2937}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week>div{text-align:center;padding:10px;font-weight:700}.week>div:first-child{color:#d14343}.week>div:last-child{color:#4276cc}.day{min-height:120px;border:1px solid #e1e7ed;background:white;padding:8px;cursor:pointer;overflow:hidden}.day:hover{background:#f1f7ff}.day.blank{background:#f7f9fb;cursor:auto}.num{font-weight:700}.sun .num{color:#d14343}.sat .num{color:#4276cc}.tag{margin-top:6px;font-size:12px;line-height:1.4;padding:4px 5px;border-radius:6px;background:#e8f1ff;overflow-wrap:anywhere}.tag.duty{background:#fff0db}.hint{font-size:12px;color:#788797}dialog{border:0;border-radius:16px;box-shadow:0 20px 80px #0003;width:min(96vw,530px);padding:24px}dialog::backdrop{background:#15253b99}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:flex;flex-direction:column;gap:5px;font-size:13px}.form label.full{grid-column:1/-1}.form input,.form select,.form textarea{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.existing{padding:8px 0;border-top:1px solid #e1e7ed}.existing button{padding:4px 9px}.notice{font-size:13px;color:#78582c;background:#fff8e8;padding:10px;border-radius:7px}@media(max-width:700px){.wrap{padding:10px}h1{font-size:20px}.panel{padding:10px}.day{min-height:76px;padding:4px}.tag{font-size:10px;padding:3px}.week>div{padding:5px}.num{font-size:13px}.form{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><header><div><h1>명상센터 일정관리</h1><p>월간 일정 · 일요일 당번 신청</p></div><span class="hint">시범 운영 · 브라우저 저장</span></header>
<section class="panel"><div class="toolbar"><div class="controls"><button id="prev" aria-label="이전 달">◀</button><select id="year" aria-label="연도"></select><select id="month" aria-label="월"></select><button id="next" aria-label="다음 달">▶</button><button id="today">이번 달</button></div><button class="primary" id="add">+ 일정 등록</button></div>
<div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="calendar" id="calendar"></div></section>
<div class="notice">현재 버전은 화면 시험용입니다. 저장한 내용은 사용 중인 브라우저에만 보관되며 다른 기기나 구글 스프레드시트와 공유되지 않습니다. 실제 관리자 인증과 구글 시트 저장은 아직 연결되지 않았습니다.</div>
<dialog id="editor"><h2 id="dialogTitle">일정 관리</h2><div id="existing"></div><form id="form"><div class="form"><label>날짜<input type="date" name="date" required></label><label>구분<select name="category" id="category"></select></label><label>일정명<select name="event" id="event" required></select></label><label>담당자<select name="person" id="person"></select></label><label>시작시간<input type="time" name="start"></label><label>종료시간<input type="time" name="end"></label><label class="full">상세내용<textarea name="details" rows="3"></textarea></label></div><div class="actions"><button type="button" id="remove" class="danger" hidden>삭제</button><button type="button" id="close">취소</button><button class="primary" type="submit">저장</button></div></form></dialog></div>
<script>
(()=>{
const initial={categories:[{id:"C001",name:"명상수업"},{id:"C002",name:"회의"},{id:"C003",name:"행사"},{id:"C004",name:"주말당번"}],events:[{id:"E001",cat:"C001",name:"저녁 명상"},{id:"E002",cat:"C001",name:"정기 명상"},{id:"E003",cat:"C002",name:"센터 운영회의"},{id:"E004",cat:"C003",name:"특별 강의"},{id:"E005",cat:"C004",name:"일요일 당번"}],people:[{id:"P001",name:"김철수"},{id:"P002",name:"이영희"},{id:"P003",name:"박민수"}]};
const key="meditation-calendar-demo-v1",store=()=>{try{return JSON.parse(localStorage.getItem(key))||[]}catch{return []}};
let entries=store(),now=new Date(),yy=now.getFullYear(),mm=now.getMonth(),editId=null;
const $=id=>document.getElementById(id),form=$("form"),fields=form.elements;
const pad=n=>String(n).padStart(2,"0"),iso=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d),safe=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const cname=id=>initial.categories.find(x=>x.id===id)?.name||"",ename=id=>initial.events.find(x=>x.id===id)?.name||"",pname=id=>initial.people.find(x=>x.id===id)?.name||"";
function opts(el,arr,placeholder){el.innerHTML=(placeholder?'<option value="">'+safe(placeholder)+'</option>':"")+arr.map(x=>'<option value="'+safe(x.id)+'">'+safe(x.name)+'</option>').join("")}
function syncEvents(){let v=fields.event.value;opts(fields.event,initial.events.filter(x=>x.cat===fields.category.value));if([...fields.event.options].some(o=>o.value===v))fields.event.value=v}
opts(fields.category,initial.categories);opts(fields.person,initial.people,"미지정");fields.category.onchange=syncEvents;syncEvents();
for(let y=2020;y<=2045;y++)$("year").add(new Option(y+"년",y));for(let m=0;m<12;m++)$("month").add(new Option((m+1)+"월",m));
function render(){$("year").value=yy;$("month").value=mm;const first=new Date(yy,mm,1).getDay(),days=new Date(yy,mm+1,0).getDate();let html="";for(let i=0;i<first;i++)html+='<div class="day blank"></div>';for(let d=1;d<=days;d++){const date=iso(yy,mm,d),weekday=new Date(yy,mm,d).getDay(),items=entries.filter(e=>e.date===date&&e.status!=="취소");const duties=items.filter(e=>e.category==="C004").length;html+='<div class="day '+(weekday===0?"sun":weekday===6?"sat":"")+'" data-date="'+date+'"><div class="num">'+d+'</div>'+items.map(e=>'<div class="tag '+(e.category==="C004"?"duty":"")+'">'+safe(ename(e.event))+(e.person?" · "+safe(pname(e.person)):"")+'</div>').join("")+(weekday===0&&duties<2?'<div class="hint">당번 '+(2-duties)+'명 모집</div>':"")+'</div>'} $("calendar").innerHTML=html}
function open(date){editId=null;form.reset();fields.date.value=date;fields.category.value="C001";syncEvents();$("remove").hidden=true;$("dialogTitle").textContent=date+" 일정 관리";listExisting(date);$("editor").showModal()}
function listExisting(date){const items=entries.filter(e=>e.date===date&&e.status!=="취소");$("existing").innerHTML=items.length?items.map(e=>'<div class="existing"><strong>'+safe(ename(e.event))+'</strong> '+safe(pname(e.person))+' <button type="button" data-edit="'+safe(e.id)+'">수정</button></div>').join(""):'<p class="hint">등록된 일정이 없습니다.</p>'}
function fill(e){editId=e.id;fields.date.value=e.date;fields.category.value=e.category;syncEvents();fields.event.value=e.event;fields.person.value=e.person;fields.start.value=e.start||"";fields.end.value=e.end||"";fields.details.value=e.details||"";$("remove").hidden=false;$("dialogTitle").textContent="일정 수정"}
$("calendar").onclick=e=>{const cell=e.target.closest("[data-date]");if(cell)open(cell.dataset.date)};$("add").onclick=()=>open(iso(yy,mm,1));$("close").onclick=()=>$("editor").close();$("existing").onclick=e=>{const b=e.target.closest("[data-edit]");if(b){const item=entries.find(x=>x.id===b.dataset.edit);if(item)fill(item)}};$("remove").onclick=()=>{if(editId&&confirm("이 일정을 삭제할까요?")){entries=entries.filter(e=>e.id!==editId);localStorage.setItem(key,JSON.stringify(entries));$("editor").close();render()}};
form.onsubmit=e=>{e.preventDefault();const v={date:fields.date.value,category:fields.category.value,event:fields.event.value,person:fields.person.value,start:fields.start.value,end:fields.end.value,details:fields.details.value};if(v.start&&v.end&&v.end<=v.start)return alert("종료시간이 시작시간보다 늦어야 합니다.");if(v.category==="C004"&&entries.filter(x=>x.date===v.date&&x.category==="C004"&&x.id!==editId&&x.status!=="취소").length>=2)return alert("일요일 당번은 최대 2명입니다.");if(v.category==="C004"&&new Date(v.date+"T12:00:00").getDay()!==0)return alert("주말 당번은 일요일에만 신청할 수 있습니다.");if(editId){let item=entries.find(x=>x.id===editId);Object.assign(item,v,{updated:new Date().toISOString()})}else entries.push({...v,id:crypto.randomUUID?.()||String(Date.now()),created:new Date().toISOString(),status:"정상"});localStorage.setItem(key,JSON.stringify(entries));$("editor").close();yy=Number(v.date.slice(0,4));mm=Number(v.date.slice(5,7))-1;render()};
function navigate(delta){const d=new Date(yy,mm+delta,1);yy=d.getFullYear();mm=d.getMonth();render()}$("prev").onclick=()=>navigate(-1);$("next").onclick=()=>navigate(1);$("today").onclick=()=>{yy=new Date().getFullYear();mm=new Date().getMonth();render()};$("year").onchange=e=>{yy=+e.target.value;render()};$("month").onchange=e=>{mm=+e.target.value;render()};render();
})();
</script></body></html>
